<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link href="img/logo.png" rel="icon">
    <title>Dra. Iveth Carrasco</title>
    <meta property="og:site_name" content="Dra. Iveth Carrasco">
    <meta property="og:title" content="Dra. Iveth Carrasco - Medico Estetico">
    <meta property="og:description" content="Me enfoco en mejorar, preservar y armonizar la apariencia física, buscando resultados naturales y acordes con las características de cada paciente.">
    <meta property="og:image" content="https://dcreate.github.io/TransferDraIveth/img/tarjeta.png">
    <meta property="og:url" content="https://dcreate.github.io/TransferDraIveth/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>
    <div class="card">
        <h1>💳 Datos de pago</h1>

        <!-- SELECTOR DE BANCO -->

        <div class="selector-container">
            <label for="selectorTarjeta">
            SELECCIONA EL BANCO
            </label>
            <select
            id="selectorTarjeta"
            onchange="cambiarTarjeta()">

                <option value="tarjeta1">
                    BBVA BANCOMER
                </option>

                <option value="tarjeta2">
                    SANTANDER
                </option>
            </select>

         </div>


         <!-- BANCO -->

         <div class="dato">

            <span class="etiqueta">
            BANCO
            </span>

            <div
            class="valor"
            id="banco">

            Banco 1

            </div>

        </div>

        <!-- TITULAR -->

        <div class="dato">

            <span class="etiqueta">
            TITULAR
            </span>

            <div
            class="valor"
            id="titular">

            NOMBRE DEL TITULAR

            </div>


            <button
            class="boton"
            id="botonTitular"
            onclick="copiarDato('titular','botonTitular')">

            📋 Copiar nombre

            </button>

         </div>


        <!-- TARJETA -->

         <div class="dato">

            <span class="etiqueta">
            NÚMERO DE TARJETA
            </span>

            <div
            class="valor"
            id="numero">

            0000 0000 0000 0000

            </div>


            <button
            class="boton"
            id="botonTarjeta"
            onclick="copiarDato('numero','botonTarjeta')">

            📋 Copiar número

            </button>

         </div>


        <div id="mensaje"></div>


        <!-- QR -->

        <div class="qr">

            <h3>
            📱 Escanea el código QR
            </h3>

            <img
            id="qrImagen"
            alt="Código QR">

         </div>


        <div class="aviso">

            Mantén esta información privada y
            compártela únicamente con personas
            de confianza.

        </div>


    </div>
    <script src="generador.js"></script>
    
</body>
</html>
